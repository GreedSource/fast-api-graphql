services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: graphql_api
    restart: unless-stopped
    image: graphql_api:latest
    volumes:
      - ./app.py:/app/app.py:Z
      - ./server:/app/server:Z
      - ./manage.py:/app/manage.py:Z
    ports:
      - '$PORT:$PORT'
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - POSTGRES_SERVER=${POSTGRES_SERVER:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-graphqlapp}
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "python manage.py migrate && python manage.py seed-all && uvicorn app:app --host 0.0.0.0 --port $PORT --reload --ws websockets --proxy-headers --timeout-graceful-shutdown 2"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-graphqlapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  postgres_data:
